# 아침 7시 — 매일 아침 뉴스 브리핑을 만들어 GitHub Pages 에 올린다.
#
#   https://inno-hi-inc.github.io/oneul-news/                 사람이 읽는 브리핑
#   https://inno-hi-inc.github.io/oneul-news/api/today.json   오늘하이(iOS)가 읽어가는 곳
#
# 선택 설정: Settings → Secrets and variables → Actions
#   ANTHROPIC_API_KEY  있으면 Claude 가 요약을 다듬는다.
#                      없어도 기사 리드 문장으로 발행된다 (사이트는 항상 나온다).

name: 아침 7시 뉴스 브리핑

on:
  schedule:
    # 22:00 UTC = 07:00 KST. GitHub 스케줄러는 몇 분 늦게 도는 일이 있다.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '파일을 쓰지 않고 결과만 확인'
        type: boolean
        default: false

permissions:
  contents: write   # data/ 보관본 커밋
  pages: write      # Pages 배포
  id-token: write   # Pages 배포 인증

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브리핑 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.NEWS_SITE_URL || 'https://inno-hi-inc.github.io/oneul-news' }}
          TZ: Asia/Seoul
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node build.mjs --dry
            exit 0
          fi

          # 요약은 API 키 없이 집 맥의 claude 명령으로 만든다. 그쪽이 먼저 돌아
          # 오늘치 보관본을 올려 뒀다면 여기서는 그리기만 한다.
          DATE=$(TZ=Asia/Seoul date +%F)
          if [ -f "data/$DATE.json" ]; then
            echo "오늘치 보관본이 이미 있습니다. 다시 그리기만 합니다."
            node build.mjs --render-only
          else
            echo "오늘치 보관본이 없습니다. 여기서 수집해 리드 문장으로 발행합니다."
            node build.mjs
          fi
          touch dist/.nojekyll   # Pages 가 Jekyll 로 다시 굽지 않도록

      - name: 보관본 커밋
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "oneul-hi bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "달라진 게 없어 커밋하지 않습니다."
          else
            git commit -m "news: $(TZ=Asia/Seoul date +%Y-%m-%d) 아침 브리핑 [skip ci]"
            git push
          fi

      - name: 요약 출력
        if: ${{ inputs.dry_run != true }}
        run: |
          {
            echo "### ☀️ $(TZ=Asia/Seoul date +%Y-%m-%d) 아침 브리핑"
            echo ""
            node -e "
              const d = require('./dist/api/today.json');
              console.log('- 이야기 ' + d.items.length + '개 / 밤사이 기사 ' + d.stats.articleCount + '건');
              console.log('- 요약 엔진: ' + (d.engine === 'claude' ? 'Claude' : '기사 리드 문장'));
              console.log('- 한 줄: ' + d.glance);
              console.log('');
              console.log('> ' + d.greeting);
            "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pages 아티팩트 업로드
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
